name: Publish Allure Report

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure results from triggering CI run
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: allure-results

      - name: Install Allure Commandline
        env:
          ALLURE_VERSION: 2.34.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            --output "${RUNNER_TEMP}/allure.tgz"
          tar -xzf "${RUNNER_TEMP}/allure.tgz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure HTML report
        run: allure generate allure-results --clean --output allure-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload report as GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
